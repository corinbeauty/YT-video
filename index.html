<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>門店內訓自動播放系統</title>
    <style>
        body { margin: 0; padding: 0; background-color: #000; overflow: hidden; font-family: '微軟正黑體', sans-serif; }
        #player { width: 100vw; height: 100vh; pointer-events: none; }
        
        /* 左側資訊方框 - 輕量縮放版 */
        #info-box {
            position: absolute; top: 5%; left: 1%; 
            /* 移除固定寬度，改用 min-width 和預設寬度，恢復左右縮放彈性 */
            width: auto; min-width: 200px; max-width: 50%;
            background: rgba(0, 0, 0, 0.75); color: #fff;
            padding: 10px; border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2);
            z-index: 9999; cursor: move;
            resize: both; overflow: hidden; 
            min-height: 120px;
        }
        #info-box h2 { margin: 0 0 5px 0; font-size: 14px; color: #4CAF50; border-bottom: 1px solid #4CAF50; padding-bottom: 3px; }
        
        /* Flexbox 彈性排版，文字自動整齊換行 */
        .info-row { display: flex; align-items: flex-start; margin-bottom: 5px; font-size: 11.5px; line-height: 1.5; }
        .info-label { color: #aaa; font-weight: bold; flex-shrink: 0; white-space: nowrap; }
        .info-value { flex-grow: 1; overflow-wrap: break-word; word-break: break-all; }
        
        /* 狀態列 */
        #status-log {
            margin-top: 5px; padding: 5px; background: rgba(255,255,255,0.1);
            border-radius: 4px; font-size: 10px; min-height: 15px; color: #ffeb3b;
            word-wrap: break-word;
        }
        
        /* 測試按鈕 (預設隱藏) */
        #test-btn {
            display: none; margin-top: 8px; width: 100%; padding: 5px;
            background: #2196F3; color: white; border: none;
            border-radius: 4px; cursor: pointer; font-size: 12px;
        }
        #test-btn:hover { background: #1976D2; }

        /* 隱藏的設定視窗 */
        #settings-modal {
            display: none; position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%); background: #222;
            padding: 30px; border-radius: 10px; color: white;
            z-index: 10000; width: 400px; box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        .modal-input { width: 100%; padding: 8px; margin: 5px 0 15px 0; box-sizing: border-box; }
        .modal-btn { background: #4CAF50; color: white; border: none; padding: 10px 20px; cursor: pointer; width: 100%; }
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; }
    </style>
</head>

        document.addEventListener('keydown', function(event) {
            if (event.key === "Escape") {
                document.getElementById('settings-modal').style.display = 'block';
                document.getElementById('overlay').style.display = 'block';
                document.getElementById('test-btn').style.display = 'block';
            }
        });

        function saveSettings() {
            let nStore = document.getElementById("input-store-name").value.trim();
            let nGas = document.getElementById("input-gas-url").value.trim();
            let nTimes = document.getElementById("input-play-times").value.trim();
            let nStop = document.getElementById("input-stop-minutes").value.trim();
            
            if (nStore) localStorage.setItem("storeName", nStore);
            if (nTimes) localStorage.setItem("playTimes", nTimes);
            if (nStop) localStorage.setItem("stopMinutes", nStop);
            
            if (nGas) localStorage.setItem("gasUrl", nGas);
            else localStorage.removeItem("gasUrl");
            location.reload();
        }

        // 日期計算
        function getDateKey(d) {
            let month = (d.getMonth() + 1).toString().padStart(2, '0');
            let day = d.getDate().toString().padStart(2, '0');
            return `${month}/${day}`;
        }
        function getTodayKey() { return getDateKey(new Date()); }

        const dateKey = getTodayKey();
        const currentPlaylistData = playlistSchedule[dateKey];
        const targetPlaylistId = currentPlaylistData ? currentPlaylistData.id : "PLCV-Y48MR1Jdn2OHxmCDXk60S6wj7FFLb";
        document.getElementById("video-schedule").innerText = `[${dateKey}] ${currentPlaylistData ? currentPlaylistData.title : "無排程"}`;

        // 載入 YT API
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                playerVars: { 'autoplay': 1, 'controls': 0, 'loop': 1, 'mute': 1, 'listType': 'playlist', 'list': targetPlaylistId },
                events: { 'onReady': onPlayerReady, 'onStateChange': onPlayerStateChange }
            });
        }
        function onPlayerReady(event) { event.target.playVideo(); }
        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.PLAYING && !isCompleted) {
                let vData = player.getVideoData();
                if (vData && vData.title) document.getElementById("video-schedule").innerText = `[${dateKey}] ${vData.title}`;
                let dur = player.getDuration();
                if(dur > 0) document.getElementById("loop-estimate").innerText = dur >= 3600 ? "(滿1小時)" : `(預計播 ${Math.ceil(3600/dur)} 次)`;
            } else if (event.data == YT.PlayerState.PAUSED && !isCompleted) {
                setTimeout(() => player.playVideo(), 500); // 防休眠
            }
        }

        // 主迴圈
        setInterval(() => {
            let now = new Date();
            document.getElementById("current-time").innerText = now.toLocaleString('zh-TW', { hour12: false });
            
            // 計算下次時間
            let currentMinutes = now.getHours() * 60 + now.getMinutes();
            let timeValues = playTimesList.map(t => { let p = t.split(':'); return parseInt(p[0]) * 60 + parseInt(p[1]); }).sort((a,b) => a - b);
            let nextTimeStr = "", nextDateKey = dateKey;
            let foundToday = false;
            
            for (let t of timeValues) {
                if (t > currentMinutes) {
                    nextTimeStr = `${Math.floor(t/60).toString().padStart(2,'0')}:${(t%60).toString().padStart(2,'0')} (今日)`;
                    foundToday = true; break;
                }
            }
            if (!foundToday) {
                nextTimeStr = `${Math.floor(timeValues[0]/60).toString().padStart(2,'0')}:${(timeValues[0]%60).toString().padStart(2,'0')} (明日)`;
                let tmr = new Date(); tmr.setDate(tmr.getDate() + 1); nextDateKey = getDateKey(tmr);
            }
            document.getElementById("next-schedule-time").innerText = nextTimeStr;
            document.getElementById("next-video-title").innerText = `[${nextDateKey}] ${playlistSchedule[nextDateKey] ? playlistSchedule[nextDateKey].title : "無排程"}`;

            // ★ 觸發新排程 (時間到自動解除停止，重新開始)
            let currentHHMM = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
            if (playTimesList.includes(currentHHMM) && now.getSeconds() === 0) {
                if (dateKey !== getTodayKey()) location.reload(); // 跨日換片
                
                playStartTime = now.getTime();
                isCompleted = false; // 解除停止標記
                screenshotCount = 0;
                scheduleSeconds.forEach(t => hasTriggered[t] = false);
                
                document.getElementById("screenshot-count").innerText = "0 張";
                if (player && typeof player.playVideo === 'function') player.playVideo();
                showLog(`[${currentHHMM}] 系統甦醒，開始新一輪 ${stopMinutes} 分鐘巡檢！`, "#4CAF50");
            }

            // 更新影片時間
            if(player && player.getCurrentTime && !isCompleted) {
                let currentSec = Math.floor(player.getCurrentTime());
                document.getElementById("video-current-time").innerText = `${Math.floor(currentSec/60).toString().padStart(2,'0')}:${(currentSec%60).toString().padStart(2,'0')}`;
            }

            // ★ 滿時自動停止機制 & 截圖邏輯
            if (playStartTime && !isCompleted) {
                let elapsedMs = now.getTime() - playStartTime;
                let elapsedSeconds = Math.floor(elapsedMs / 1000);
                let elapsedMins = Math.floor(elapsedSeconds / 60);
                
                document.getElementById("total-play-time").innerText = elapsedMins + " 分鐘";

                // 檢查是否超過設定的自動停止時間 (預設60分鐘)
                if (elapsedMins >= stopMinutes) {
                    isCompleted = true; // 標記為完成，停止迴圈計時
                    if (player && typeof player.stopVideo === 'function') player.stopVideo(); // 強制停止 YT
                    
                    showLog(`✅ 已完成 ${stopMinutes} 分鐘內訓，影片自動停止等待下次排程。`, "#4CAF50");
                    document.getElementById("video-current-time").innerText = "已停止";
                    document.getElementById("loop-estimate").innerText = "";
                } else {
                    // 若未超時，則正常檢查截圖
                    scheduleSeconds.forEach(targetSec => {
                        if (elapsedSeconds >= targetSec && !hasTriggered[targetSec]) {
                            hasTriggered[targetSec] = true;
                            takeAndUploadScreenshot(`排程: ${targetSec < 60 ? targetSec+'秒' : (targetSec/60)+'分鐘'}`);
                        }
                    });
                }
            }
        }, 1000);

        function showLog(msg, color = "#ffeb3b") {
            const logEl = document.getElementById("status-log");
            logEl.style.color = color; logEl.innerText = msg;
        }

        function takeAndUploadScreenshot(type = "自動截圖") {
            showLog(`[${type}] 呼叫外掛截圖中...`, "#03A9F4");
            window.postMessage({ type: "REQUEST_CAPTURE" }, "*");
            let captureTimeout = setTimeout(() => { showLog(`[${type}] 截圖失敗：未偵測到 Chrome 外掛！`, "#f44336"); }, 3000);

            function captureListener(event) {
                if (event.source !== window || !event.data) return;
                if (event.data.type === "RECEIVE_CAPTURE") {
                    clearTimeout(captureTimeout); 
                    window.removeEventListener("message", captureListener);
                    showLog(`[${type}] 擷取成功，上傳雲端中...`, "#ffeb3b");
                    uploadToCloud(event.data.dataUrl, type);
                }
            }
            window.addEventListener("message", captureListener);
        }

        function uploadToCloud(base64Data, type) {
            let payload = {
                image: base64Data, storeName: storeName, type: type,
                time: document.getElementById("current-time").innerText,
                videoTitle: document.getElementById("video-schedule").innerText
            };
            fetch(gasUrl, {
                method: "POST", mode: "no-cors",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            }).then(() => {
                screenshotCount++;
                document.getElementById("screenshot-count").innerText = `${screenshotCount} 張`;
                showLog(`[${type}] 上傳成功！已存入雲端。`, "#4CAF50");
            }).catch(() => showLog(`[${type}] 連線錯誤。`, "#f44336"));
        }

        // 拖曳與縮放衝突修正 (防護區間機制)
        const infoBox = document.getElementById("info-box");
        let isDragging = false, offsetX, offsetY;
        
        infoBox.addEventListener("mousedown", (e) => {
            if(e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return;
            
            // ★ 核心修正：偵測滑鼠是否點擊在右下角的「縮放控制代碼」範圍 (約 25x25 像素)
            let rect = infoBox.getBoundingClientRect();
            if (e.clientX >= rect.right - 25 && e.clientY >= rect.bottom - 25) {
                return; // 如果點在右下角，直接中斷拖曳邏輯，讓瀏覽器執行原生縮放！
            }

            isDragging = true; 
            offsetX = e.clientX - rect.left; 
            offsetY = e.clientY - rect.top;
            infoBox.style.cursor = "grabbing";
        });
        
        document.addEventListener("mousemove", (e) => {
            if (!isDragging) return; 
            infoBox.style.left = (e.clientX - offsetX) + "px"; 
            infoBox.style.top = (e.clientY - offsetY) + "px";
        });
        
        document.addEventListener("mouseup", () => { 
            isDragging = false; 
            infoBox.style.cursor = "move"; 
        });
    </script>
</body>
</html>
