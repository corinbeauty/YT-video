<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>門店內訓自動播放系統</title>
    <style>
        body { margin: 0; padding: 0; background-color: #000; overflow: hidden; font-family: '微軟正黑體', sans-serif; }
        #player { width: 100vw; height: 100vh; pointer-events: none; }
        
        #info-box {
            position: absolute; top: 5%; left: 1%; width: 250px; /* ★ 固定約可容納 20 個中文字元的寬度 */
            background: rgba(0, 0, 0, 0.75); color: #fff;
            padding: 10px; border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2);
            z-index: 9999; cursor: move;
            resize: both; /* 允許手動縮放 */
            overflow: hidden; /* 防止內容溢出 */
            min-width: 200px; /* 最小寬度限制 */
            min-height: 120px;
        }
        #info-box h2 { margin: 0 0 5px 0; font-size: 14px; color: #4CAF50; border-bottom: 1px solid #4CAF50; padding-bottom: 3px; }
        
        /* ★ 採用 Flexbox 讓文字自動換行且排版對齊 (移除 nowrap 截斷設定) */
        .info-row { display: flex; align-items: flex-start; margin-bottom: 5px; font-size: 11.5px; line-height: 1.5; }
        .info-label { color: #aaa; font-weight: bold; flex-shrink: 0; white-space: nowrap; }
        .info-value { flex-grow: 1; overflow-wrap: break-word; word-break: break-all; } /* ★ 長文字強制換行，且第二行會自動對齊第一行 */
        
        /* 狀態列 (縮小) */
        #status-log {
            margin-top: 5px; padding: 5px; background: rgba(255,255,255,0.1);
            border-radius: 4px; font-size: 10px; min-height: 15px; color: #ffeb3b;
            word-wrap: break-word;
        }
        
        /* 手動測試按鈕 (預設隱藏) */
        #test-btn {
            display: none; /* 預設隱藏 */
            margin-top: 8px; width: 100%; padding: 5px;
            background: #2196F3; color: white; border: none;
            border-radius: 4px; cursor: pointer; font-size: 12px;
        }
        #test-btn:hover { background: #1976D2; }

        /* ESC 提示文字 (預設隱藏) */
        #esc-hint {
            display: none; /* 預設隱藏 */
            font-size: 10px; color: #888; margin-top: 5px; text-align: center;
        }

        /* 隱藏的設定視窗 */
        #settings-modal {
            display: none; position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%); background: #222;
            padding: 30px; border-radius: 10px; color: white;
            z-index: 10000; width: 400px; box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        .modal-input { width: 100%; padding: 8px; margin: 10px 0 20px 0; box-sizing: border-box; }
        .modal-btn { background: #4CAF50; color: white; border: none; padding: 10px 20px; cursor: pointer; width: 100%; }
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; }
    </style>
</head>

        <button id="test-btn" onclick="takeAndUploadScreenshot('手動測試')">馬上測試一鍵截圖</button>
        <div id="esc-hint">按 ESC 鍵開啟設定</div>

        let gasUrl = localStorage.getItem("gasUrl") || defaultGasUrl;
        let playTimesStr = localStorage.getItem("playTimes") || defaultPlayTimes;
        let captureTimesStr = localStorage.getItem("captureTimes") || defaultCaptureTimes;

        document.getElementById("store-name").innerText = storeName;
        document.getElementById("input-store-name").value = storeName;
        document.getElementById("input-gas-url").value = localStorage.getItem("gasUrl") || "";
        document.getElementById("input-play-times").value = playTimesStr;
        document.getElementById("input-capture-times").value = captureTimesStr;

        // 解析排程
        let playTimesList = playTimesStr.split(',').map(s => s.trim());
        let scheduleSeconds = captureTimesStr.split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n));
        let hasTriggered = {};
        scheduleSeconds.forEach(t => hasTriggered[t] = false);

        // ESC 開啟設定與顯示測試按鈕
        document.addEventListener('keydown', function(event) {
            if (event.key === "Escape") {
                document.getElementById('settings-modal').style.display = 'block';
                document.getElementById('overlay').style.display = 'block';
                document.getElementById('test-btn').style.display = 'block'; // 顯示測試按鈕
            }
        });

        function saveSettings() {
            let newStore = document.getElementById("input-store-name").value.trim();
            let newGas = document.getElementById("input-gas-url").value.trim();
            let newPlayTimes = document.getElementById("input-play-times").value.trim();
            let newCaptureTimes = document.getElementById("input-capture-times").value.trim();

            if (newStore) localStorage.setItem("storeName", newStore);
            if (newPlayTimes) localStorage.setItem("playTimes", newPlayTimes);
            if (newCaptureTimes) localStorage.setItem("captureTimes", newCaptureTimes);
            if (newGas) {
                localStorage.setItem("gasUrl", newGas);
            } else {
                localStorage.removeItem("gasUrl"); // 清空時恢復預設
            }
            location.reload();
        }

        // 取得特定日期的 Key (例如 "08/01")
        function getDateKey(dateObj) {
            let month = (dateObj.getMonth() + 1).toString().padStart(2, '0');
            let day = dateObj.getDate().toString().padStart(2, '0');
            return `${month}/${day}`;
        }

        // 取得今日日期的 Key
        function getTodayKey() {
            let params = new URLSearchParams(window.location.search);
            if(params.has('date')) return params.get('date');
            return getDateKey(new Date());
        }
        
        // 取得明日日期的 Key
        function getTomorrowKey() {
            let tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            return getDateKey(tomorrow);
        }

        const dateKey = getTodayKey();
        const currentPlaylistData = playlistSchedule[dateKey];
        const targetPlaylistId = currentPlaylistData ? currentPlaylistData.id : "PLCV-Y48MR1Jdn2OHxmCDXk60S6wj7FFLb";
        const targetTitle = currentPlaylistData ? currentPlaylistData.title : "本日無排程(播放預設影片)";
        
        document.getElementById("video-schedule").innerText = `[${dateKey}] ${targetTitle}`;

        let player;
        let playStartTime = null;
        let screenshotCount = 0;
        let videoDurationCache = 0;
        
        // 載入 YouTube API
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                playerVars: { 
                    'autoplay': 1, 
                    'controls': 0, 
                    'loop': 1, 
                    'mute': 1, /* ★ 預設靜音 */
                    'listType': 'playlist',
                    'list': targetPlaylistId
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            event.target.playVideo();
        }

        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.PLAYING) {
                if (!playStartTime) playStartTime = new Date().getTime();
                
                let vData = player.getVideoData();
                if (vData && vData.title) {
                    document.getElementById("video-schedule").innerText = `[${dateKey}] ${vData.title}`;
                }
                
                videoDurationCache = player.getDuration();
                if(videoDurationCache > 0){
                    let loops = Math.ceil(3600 / videoDurationCache);
                    if(videoDurationCache >= 3600) {
                        document.getElementById("loop-estimate").innerText = "(滿1小時)";
                    } else {
                        document.getElementById("loop-estimate").innerText = `(預計播 ${loops} 次)`;
                    }
                }
            } else if (event.data == YT.PlayerState.PAUSED) {
                setTimeout(() => player.playVideo(), 500);
            }
        }

        // 時鐘與絕對時間檢查迴圈 (每秒執行)
        setInterval(() => {
            let now = new Date();
            document.getElementById("current-time").innerText = now.toLocaleString('zh-TW', { hour12: false });
            
            // ★ 計算預告下次播放時間與標題
            let currentMinutes = now.getHours() * 60 + now.getMinutes();
            let timeValues = playTimesList.map(t => {
                let parts = t.split(':');
                return parseInt(parts[0]) * 60 + parseInt(parts[1]);
            }).sort((a,b) => a - b);
            
            let nextTimeStr = "";
            let nextDateKey = dateKey; // 預設為今天的清單
            let foundToday = false;
            
            for (let t of timeValues) {
                if (t > currentMinutes) {
                    nextTimeStr = `${Math.floor(t/60).toString().padStart(2,'0')}:${(t%60).toString().padStart(2,'0')} (今日)`;
                    foundToday = true;
                    break;
                }
            }
            if (!foundToday) {
                nextTimeStr = `${Math.floor(timeValues[0]/60).toString().padStart(2,'0')}:${(timeValues[0]%60).toString().padStart(2,'0')} (明日)`;
                nextDateKey = getTomorrowKey(); // 換成明天的日期去查清單
            }
            
            document.getElementById("next-schedule-time").innerText = nextTimeStr;
            
            // 查詢下次播放的影片標題
            const nextPlaylistData = playlistSchedule[nextDateKey];
            const nextTargetTitle = nextPlaylistData ? nextPlaylistData.title : "無預定排程";
            document.getElementById("next-video-title").innerText = `[${nextDateKey}] ${nextTargetTitle}`;

            // ★ 自動重置與觸發機制
            let currentHHMM = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
            if (playTimesList.includes(currentHHMM) && now.getSeconds() === 0) {
                playStartTime = now.getTime(); // 重置開播時間
                scheduleSeconds.forEach(t => hasTriggered[t] = false); // 歸零所有截圖標記
                screenshotCount = 0;
                document.getElementById("screenshot-count").innerText = "0 張";
                if (player && typeof player.playVideo === 'function') player.playVideo();
                showLog(`[${currentHHMM}] 排程啟動，開始巡檢！`, "#4CAF50");
                
                // 檢查是否跨日，若是則重新載入網頁以抓取新清單
                if (dateKey !== getTodayKey()) {
                    location.reload(); 
                }
            }

            if(player && player.getCurrentTime) {
                let currentSec = Math.floor(player.getCurrentTime());
                let m = Math.floor(currentSec / 60).toString().padStart(2, '0');
                let s = (currentSec % 60).toString().padStart(2, '0');
                document.getElementById("video-current-time").innerText = `${m}:${s}`;
            }

            if (playStartTime) {
                let elapsedMs = now.getTime() - playStartTime;
                let elapsedSeconds = Math.floor(elapsedMs / 1000);
                
                document.getElementById("total-play-time").innerText = Math.floor(elapsedSeconds / 60) + " 分鐘";

                scheduleSeconds.forEach(targetSec => {
                    if (elapsedSeconds >= targetSec && !hasTriggered[targetSec]) {
                        hasTriggered[targetSec] = true;
                        let typeStr = targetSec < 60 ? `${targetSec}秒` : `${targetSec/60}分鐘`;
                        takeAndUploadScreenshot(`排程: ${typeStr}`);
                    }
                });
            }
        }, 1000);

        function showLog(msg, color = "#ffeb3b") {
            const logEl = document.getElementById("status-log");
            logEl.style.color = color;
            logEl.innerText = msg;
        }

        function takeAndUploadScreenshot(type = "自動截圖") {
            showLog(`[${type}] 呼叫外掛截圖中...`, "#03A9F4");
            window.postMessage({ type: "REQUEST_CAPTURE" }, "*");

            let captureTimeout = setTimeout(() => {
                showLog(`[${type}] 截圖失敗：未偵測到外掛！`, "#f44336");
            }, 3000);

            function captureListener(event) {
                if (event.source !== window || !event.data) return;

                if (event.data.type === "RECEIVE_CAPTURE") {
                    clearTimeout(captureTimeout); 
                    window.removeEventListener("message", captureListener);

                    let imgData = event.data.dataUrl;
                    showLog(`[${type}] 擷取成功，上傳雲端...`, "#ffeb3b");
                    uploadToCloud(imgData, type);
                }
            }
            window.addEventListener("message", captureListener);
        }

        function uploadToCloud(base64Data, type) {
            let payload = {
                image: base64Data,
                storeName: storeName,
                time: document.getElementById("current-time").innerText,
                type: type,
                videoTitle: document.getElementById("video-schedule").innerText
            };

            let formData = new URLSearchParams();
            formData.append('data', JSON.stringify(payload));

            fetch(gasUrl, {
                method: 'POST',
                // ★ 啟用 no-cors 盲傳模式，無視 CORS 阻擋回傳成功
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: formData.toString()
            })
            .then(() => {
                // 只要網路沒斷線，就視為傳輸成功
                screenshotCount++;
                document.getElementById("screenshot-count").innerText = `${screenshotCount} 張`;
                showLog(`[${type}] 上傳成功！`, "#4CAF50");
            })
            .catch(err => {
                showLog(`[${type}] 網路連線失敗。`, "#f44336");
            });
        }
    </script>
</body>
</html>
