    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 新增 Referrer 策略，避免被 YouTube 阻擋 (Error 153) -->
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>門店內訓影音自動播放暨雲端巡檢系統 V4.0 (測試支援)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        #player-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        #player {
            width: 100%;
            height: 100%;
            pointer-events: auto;
        }
        /* 隱藏捲軸但允許捲動 */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>

<body class="bg-black text-white select-none">

    <!-- 主播放容器 (包含動態浮水印，供截圖使用) -->
    <div id="capture-region" class="relative w-full h-full">
        <!-- YouTube 播放器 -->
        <div id="player-container">
            <div id="player"></div>
        </div>

        <div class="absolute top-4 left-4 right-4 flex justify-between items-start pointer-events-none z-50">

                    <span class="w-3 h-3 bg-red-500 rounded-full animate-ping"></span>
                    <span class="font-bold text-red-400 text-xs tracking-wider uppercase">內訓播放中 (至少1小時)</span>
                    <span id="store-display" class="bg-blue-600/80 text-white text-xs px-2 py-0.5 rounded font-mono">門店名稱未設定</span>
                    <span id="slot-display" class="bg-emerald-600/80 text-white text-xs px-2 py-0.5 rounded font-mono">時段辨識中</span>
                    <span id="test-mode-badge" class="hidden bg-purple-600/80 text-white text-xs px-2 py-0.5 rounded font-mono">測試模式</span>
                </div>
                <h1 id="video-title" class="text-base font-bold text-white truncate">正在載入播放清單...</h1>
                <p id="clock-display" class="text-yellow-400 font-mono text-sm mt-1">讀取中...</p>
            </div>

            <!-- 右上角系統狀態證明水壓印 -->

                <div id="upload-status" class="text-xs text-green-400 font-mono mt-0.5">系統待命中</div>
            </div>
        </div>
    </div>

    <!-- 設定選單 (按下 Esc 時可設定) -->

                <span class="text-xs font-normal text-gray-500">按 ESC 可再次呼叫此選單</span>
            </h2>
            
            <div class="space-y-4 overflow-y-auto hide-scrollbar flex-grow pr-2">
                <!-- 基本設定 -->
                <div class="bg-gray-800/50 p-4 rounded-xl border border-gray-700/50">
                    <h3 class="text-sm font-semibold text-blue-400 mb-3">基本連線設定</h3>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs font-medium text-gray-400 mb-1">門店名稱 (將顯示於截圖浮水印)</label>
                            <input type="text" id="cfg-store-name" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-blue-500" placeholder="例如：台北忠孝店">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-400 mb-1">Google Apps Script URL (接收截圖的雲端 API)</label>
                            <input type="text" id="cfg-gas-url" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-blue-500" placeholder="https://script.google.com/macros/s/.../exec">
                        </div>
                    </div>
                </div>

                <!-- 測試與自訂設定 -->
                <div class="bg-gray-800/50 p-4 rounded-xl border border-gray-700/50 border-l-4 border-l-purple-500">
                    <h3 class="text-sm font-semibold text-purple-400 mb-3">測試與進階控制 (非必填)</h3>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs font-medium text-gray-400 mb-1">強制模擬日期 (測試特定日期應播放的主題)</label>
                            <div class="flex space-x-2">
                                <input type="date" id="cfg-test-date" class="bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-purple-500">
                                <button onclick="document.getElementById('cfg-test-date').value=''" class="px-3 py-2 text-xs bg-gray-700 hover:bg-gray-600 rounded-lg">清除(使用真實時間)</button>
                            </div>
                            <p class="text-[10px] text-gray-500 mt-1">若設定日期，系統將無視當下時間，強制載入該日期應播的清單。</p>
                        </div>
                        
                        <div>
                            <label class="block text-xs font-medium text-gray-400 mb-1">自訂播放清單 JSON (動態更新列表)</label>
                            <textarea id="cfg-custom-playlist" rows="4" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-white text-xs font-mono focus:outline-none focus:border-purple-500" placeholder='[{"id":"影片ID","title":"標題"}]'></textarea>
                            <p class="text-[10px] text-gray-500 mt-1">若留空則使用系統內建的預設 07/01-09/30 清單。</p>
                        </div>
                    </div>
                </div>
            </div>

            </div>

            } catch (e) {
                console.error("自訂清單解析失敗，使用預設", e);
                activePlaylists = defaultPlaylists;
            }

            if (!storeName || !gasUrl) {
                showConfigModal();
            } else {
                updateStoreDisplay();
            }

            detectTimeSlot();
            setInterval(updateClock, 1000);
            updateClock();

            // 監聽鍵盤 Esc 開啟設定
            window.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') showConfigModal();
            });
            
            // 若未載入 YT API，則手動觸發（首次開啟時）
            if (storeName && gasUrl && !document.querySelector('script[src="https://www.youtube.com/iframe_api"]')) {
                loadYouTubeAPI();
            }
        });

        // 辨識目前屬於哪個規定播放時段，支援測試模式覆蓋
        function detectTimeSlot() {
            if (testDateStr) {
                document.getElementById('test-mode-badge').classList.remove('hidden');
                currentSlot = "手動測試時段";
            } else {
                document.getElementById('test-mode-badge').classList.add('hidden');
                const hour = new Date().getHours();
                if (hour >= 11 && hour <= 13) {
                    currentSlot = "12點午間時段";
                } else if (hour >= 17 && hour <= 19) {
                    currentSlot = "18點晚間時段";
                } else if (hour >= 23 || hour <= 1) {
                    currentSlot = "00點凌晨時段";
                } else {
                    currentSlot = "一般非規定時段";
                }
            }
            document.getElementById('slot-display').innerText = currentSlot;
        }

        // 更新畫面上的時鐘
        function updateClock() {
            // 如果有設定測試日期，時鐘前半段顯示測試日期，後半段顯示當前真實時間
            const now = new Date();
            const timePart = String(now.getHours()).padStart(2, '0') + ':' +
                             String(now.getMinutes()).padStart(2, '0') + ':' +
                             String(now.getSeconds()).padStart(2, '0');
                             
            let datePart;
            if (testDateStr) {
                // 測試模式下顯示假日期
                datePart = testDateStr;
                document.getElementById('clock-display').innerHTML = `<span class="text-purple-400 font-bold">[模擬日期]</span> ${datePart} ${timePart}`;
            } else {
                datePart = now.getFullYear() + '-' +
                           String(now.getMonth() + 1).padStart(2, '0') + '-' +
                           String(now.getDate()).padStart(2, '0');
                document.getElementById('clock-display').innerText = `${datePart} ${timePart}`;
            }
        }

        function updateStoreDisplay() {
            document.getElementById('store-display').innerText = storeName || "門店名稱未設定";
        }

        function showConfigModal() {
            document.getElementById('cfg-store-name').value = storeName;
            document.getElementById('cfg-gas-url').value = gasUrl;
            document.getElementById('cfg-test-date').value = testDateStr;
            document.getElementById('cfg-custom-playlist').value = customPlaylistStr;
            document.getElementById('config-modal').classList.remove('hidden');
        }
        
        function hideConfigModal() {
            document.getElementById('config-modal').classList.add('hidden');
        }

        function saveAndReload() {
            storeName = document.getElementById('cfg-store-name').value.trim();
            gasUrl = document.getElementById('cfg-gas-url').value.trim();
            testDateStr = document.getElementById('cfg-test-date').value;
            customPlaylistStr = document.getElementById('cfg-custom-playlist').value.trim();
            
            // 驗證 JSON 格式
            if (customPlaylistStr) {
                try {
                    JSON.parse(customPlaylistStr);
                } catch (e) {
                    alert("自訂播放清單的 JSON 格式錯誤，請檢查後再存檔！");
                    return;
                }
            }

            localStorage.setItem("STORE_NAME", storeName);
            localStorage.setItem("GAS_URL", gasUrl);
            localStorage.setItem("TEST_DATE", testDateStr);
            localStorage.setItem("CUSTOM_PLAYLIST", customPlaylistStr);
            
            // 直接重新整理頁面以套用所有新設定與新時間
            window.location.reload();
        }

        // 3. 計算當天應播項目 (支援測試日期)
        function getTargetPlaylist() {
            // 若有測試日期，以此計算
            let targetDate = new Date();
            if (testDateStr) {
                targetDate = new Date(testDateStr);
            }
            
            const startOfYear = new Date(targetDate.getFullYear(), 0, 0);
            const diff = targetDate - startOfYear;
            const oneDay = 1000 * 60 * 60 * 24;
            const dayOfYear = Math.floor(diff / oneDay);
            
            // 防錯處理：如果列表為空
            if (!activePlaylists || activePlaylists.length === 0) {
                return { id: "", title: "清單為空，請檢查設定" };
            }
            
            const index = dayOfYear % activePlaylists.length;
            return activePlaylists[index];
        }

        function loadYouTubeAPI() {
            var tag = document.createElement('script');
            tag.src = "https://www.youtube.com/iframe_api";
            var firstScriptTag = document.getElementsByTagName('script')[0];
            firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
        }

        function onYouTubeIframeAPIReady() {
            currentPlaylist = getTargetPlaylist();
            document.getElementById('video-title').innerText = currentPlaylist.title;

            // 若 ID 為空，則不載入播放器
            if (!currentPlaylist.id) {
                document.getElementById('video-title').innerText += " (找不到有效影片ID)";
                return;
            }

            player = new YT.Player('player', {
                // 改用無 Cookie 網域，可解決本地端 file:// 憑證不足問題
                host: 'https://www.youtube-nocookie.com',
                playerVars: {
                    'listType': 'playlist',
                    'list': currentPlaylist.id,
                    'autoplay': 1,
                    'controls': 1,
                    'rel': 0,
                    // 強制帶入偽裝的 origin，繞過 Error 153 檢查
                    'origin': 'https://www.youtube.com'
                },
                events: {
                    'onReady': onPlayerReady,
                    'onError': onPlayerError
                }
            });
        }
        
        function onPlayerError(event) {
            console.error("YouTube 播放器發生錯誤", event.data);
            document.getElementById('upload-status').innerText = `播放器載入失敗 (代碼: ${event.data})`;
        }

        function onPlayerReady(event) {
            event.target.playVideo();

            // 若在測試模式，則不啟用 1 小時後自動關閉，避免影響測試
            if (!testDateStr) {
                // 每時段自動拍攝 3 張巡檢證明截圖
                setTimeout(() => captureAndUpload("截圖1_開播5分鐘"), 5 * 60 * 1000);
                setTimeout(() => captureAndUpload("截圖2_開播30分鐘"), 30 * 60 * 1000);
                setTimeout(() => captureAndUpload("截圖3_開播60分鐘滿時"), 60 * 60 * 1000);

                // 確保播放時間至少 1 小時 (設定為 65 分鐘後關閉)
                setTimeout(() => {
                    window.close();
                }, 65 * 60 * 1000);
            } else {
                document.getElementById('upload-status').innerText = "測試模式中，暫停自動關閉與排程截圖";
            }
        }

        // 提供給設定面板的「馬上測試截圖」按鈕呼叫
        function forceTestCapture() {
            if (!gasUrl) {
                alert("請先填寫並儲存 GAS URL 才能測試！");
                return;
            }
            hideConfigModal();
            captureAndUpload("手動點擊測試截圖");
        }

        // 5. 自動截圖與傳輸引擎
        function captureAndUpload(phaseTag) {
            const statusEl = document.getElementById('upload-status');
            statusEl.innerText = `正在擷取畫面 [${phaseTag}]...`;
            statusEl.classList.remove('text-green-400');
            statusEl.classList.add('text-yellow-400');

            // 使用 html2canvas 截圖
            html2canvas(document.getElementById('capture-region'), {
                useCORS: true,       // 允許跨域圖片 (YouTube iframe 其實截不到內部，但浮水印截得到，背景會是黑的，已足夠證明)
                allowTaint: true,
                backgroundColor: '#000000',
                logging: false       // 關閉終端機日誌
            }).then(canvas => {
                const imageBase64 = canvas.toDataURL('image/jpeg', 0.8); // 壓縮成 JPG，品質 0.8 以加快傳輸
                uploadToCloud(imageBase64, phaseTag);
            }).catch(err => {
                statusEl.innerText = "截圖引擎失敗: " + err.message;
                statusEl.classList.add('text-red-400');
            });
        }

        function uploadToCloud(imageBase64, phaseTag) {
            const statusEl = document.getElementById('upload-status');
            statusEl.innerText = `正在上傳雲端...`;

            // 確保擷取的是畫面上顯示的時間 (包含假時間)
            const timestampText = document.getElementById('clock-display').innerText.replace('[模擬日期] ', '');

            const payload = {
                storeName: storeName || "未命名門店",
                slot: currentSlot,
                timestamp: timestampText,
                videoTitle: currentPlaylist ? currentPlaylist.title : "未知主題",
                phaseTag: phaseTag,
                imageBase64: imageBase64
            };

            fetch(gasUrl, {
                method: 'POST',
                mode: 'no-cors', // 重要：因為跨域，GAS 回傳的 JSON 瀏覽器收不到，但請求確實發出了
                headers: {
                    'Content-Type': 'text/plain' // 使用 text/plain 避免 preflight 請求問題
                },
                body: JSON.stringify(payload)
            }).then(() => {
                // 因 no-cors 永遠會走到 then，即便 GAS 有錯
                statusEl.innerText = `[${phaseTag}] 傳輸請求已發出!`;
                statusEl.classList.remove('text-yellow-400');
                statusEl.classList.add('text-green-400');
            }).catch(err => {
                statusEl.innerText = "連線失敗: " + err.message;
                statusEl.classList.add('text-red-400');
            });
        }
    </script>
