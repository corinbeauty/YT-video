<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>門店內訓自動播放系統</title>
    <style>
        body { margin: 0; padding: 0; background-color: #000; overflow: hidden; font-family: '微軟正黑體', sans-serif; }
        #player { width: 100vw; height: 100vh; pointer-events: none; }
        
        /* 左側資訊方框 */
        #info-box {
            position: absolute; top: 10%; left: 2%; width: 320px;
            background: rgba(0, 0, 0, 0.75); color: #fff;
            padding: 20px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2);
            z-index: 9999; cursor: move;
        }
        #info-box h2 { margin: 0 0 15px 0; font-size: 22px; color: #4CAF50; border-bottom: 1px solid #4CAF50; padding-bottom: 5px; }
        .info-row { margin-bottom: 10px; font-size: 16px; line-height: 1.5; }
        .info-label { color: #aaa; font-weight: bold; }
        
        /* 狀態列 */
        #status-log {
            margin-top: 15px; padding: 10px; background: rgba(255,255,255,0.1);
            border-radius: 6px; font-size: 14px; min-height: 40px; color: #ffeb3b;
        }
        
        /* 手動測試按鈕 */
        #test-btn {
            margin-top: 15px; width: 100%; padding: 10px;
            background: #2196F3; color: white; border: none;
            border-radius: 6px; cursor: pointer; font-size: 16px;
        }
        #test-btn:hover { background: #1976D2; }

        /* 隱藏的設定視窗 */
        #settings-modal {
            display: none; position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%); background: #222;
            padding: 30px; border-radius: 10px; color: white;
            z-index: 10000; width: 400px; box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        .modal-input { width: 100%; padding: 8px; margin: 10px 0 20px 0; box-sizing: border-box; }
        .modal-btn { background: #4CAF50; color: white; border: none; padding: 10px 20px; cursor: pointer; width: 100%; }
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; }
    </style>
</head>
<body>

    <!-- YouTube 播放器容器 -->
    <div id="player"></div>

    <!-- 左側資訊方框 -->
    <div id="info-box">
        <h2>📌 門店內訓巡檢系統</h2>
        <div class="info-row"><span class="info-label">🏪 門店名稱：</span><span id="store-name">讀取中...</span></div>
        <div class="info-row"><span class="info-label">📅 目前時間：</span><span id="current-time">讀取中...</span></div>
        <div class="info-row"><span class="info-label">🎬 影片標題：</span><span id="video-title">載入中...</span></div>
        <div class="info-row"><span class="info-label">▶ 總播放：</span><span id="total-play-time">0 分鐘</span></div>
        <div class="info-row"><span class="info-label">⏱ 影片時間：</span><span id="video-current-time">00:00</span> <span id="loop-estimate" style="color:#03A9F4; font-size:14px;"></span></div>
        <div class="info-row"><span class="info-label">📸 已截圖：</span><span id="screenshot-count">0 張</span></div>
        <div id="status-log">系統初始化中...</div>
        <button id="test-btn" onclick="takeAndUploadScreenshot('手動測試')">馬上測試一鍵截圖</button>
        <div style="font-size: 12px; color: #888; margin-top: 10px; text-align: center;">按 ESC 鍵開啟設定</div>
    </div>

    <!-- 設定視窗 -->
    <div id="overlay"></div>
    <div id="settings-modal">
        <h3 style="margin-top:0; border-bottom: 1px solid #444; padding-bottom: 10px;">⚙️ 系統設定</h3>
        <label>門店名稱：</label>
        <input type="text" id="input-store-name" class="modal-input" placeholder="例如：中清店">
        <label>Google Apps Script URL (接收端)：</label>
        <input type="text" id="input-gas-url" class="modal-input" placeholder="貼上 /exec 結尾的網址">
        <button class="modal-btn" onclick="saveSettings()">儲存並重新載入</button>
    </div>

    <script>
        // 預設參數 (若 localStorage 沒有資料則使用此預設值)
        const defaultStoreName = "中清店";
        const defaultGasUrl = "https://script.google.com/macros/s/AKfycbwbQo4R0S3kLX0Pc6w9xj6jdSOoWS2vEavN8xQMn77Oi8yV6uKJn7du7NKB9u10UD61/exec";

        let storeName = localStorage.getItem("storeName") || defaultStoreName;
        let gasUrl = localStorage.getItem("gasUrl") || defaultGasUrl;

        document.getElementById("store-name").innerText = storeName;
        document.getElementById("input-store-name").value = storeName;
        document.getElementById("input-gas-url").value = localStorage.getItem("gasUrl") || "";

        // 設定選單控制
        document.addEventListener('keydown', function(event) {
            if (event.key === "Escape") {
                document.getElementById('settings-modal').style.display = 'block';
                document.getElementById('overlay').style.display = 'block';
            }
        });

        function saveSettings() {
            let newStore = document.getElementById("input-store-name").value.trim();
            let newGas = document.getElementById("input-gas-url").value.trim();
            if (newStore) localStorage.setItem("storeName", newStore);
            if (newGas) {
                localStorage.setItem("gasUrl", newGas);
            } else {
                localStorage.removeItem("gasUrl"); // 清空時恢復預設
            }
            location.reload();
        }

        // 系統變數
        let player;
        let playStartTime = null;
        let screenshotCount = 0;
        let videoDurationCache = 0;
        
        // 排程設定：15秒, 1分, 2分, 5分
        const scheduleSeconds = [15, 60, 120, 300];
        let hasTriggered = { 15: false, 60: false, 120: false, 300: false };

        // 載入 YouTube API
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: 'jfKfPfyJRdk', // 預設 lofi hip hop 作為測試影片
                playerVars: { 'autoplay': 1, 'controls': 0, 'loop': 1, 'mute': 0 },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            event.target.playVideo();
            document.getElementById("video-title").innerText = "影片讀取中...";
        }

        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.PLAYING) {
                if (!playStartTime) playStartTime = new Date().getTime();
                let vData = player.getVideoData();
                if (vData && vData.title) {
                    document.getElementById("video-title").innerText = vData.title;
                }
                
                // 計算預估輪播次數
                videoDurationCache = player.getDuration();
                if(videoDurationCache > 0){
                    let loops = Math.ceil(3600 / videoDurationCache);
                    if(videoDurationCache >= 3600) {
                        document.getElementById("loop-estimate").innerText = "(滿1小時)";
                    } else {
                        document.getElementById("loop-estimate").innerText = `(預計播 ${loops} 次)`;
                    }
                }
            } else if (event.data == YT.PlayerState.PAUSED) {
                // 防休眠機制：發現被暫停就強制喚醒
                setTimeout(() => player.playVideo(), 500);
            }
        }

        // 時鐘與絕對時間檢查迴圈 (每秒執行)
        setInterval(() => {
            let now = new Date();
            // 更新目前時間
            document.getElementById("current-time").innerText = now.toLocaleString('zh-TW', { hour12: false });
            
            // 更新影片當前時間
            if(player && player.getCurrentTime) {
                let currentSec = Math.floor(player.getCurrentTime());
                let m = Math.floor(currentSec / 60).toString().padStart(2, '0');
                let s = (currentSec % 60).toString().padStart(2, '0');
                document.getElementById("video-current-time").innerText = `${m}:${s}`;
            }

            if (playStartTime) {
                let elapsedMs = now.getTime() - playStartTime;
                let elapsedSeconds = Math.floor(elapsedMs / 1000);
                
                // 更新總播放分鐘
                document.getElementById("total-play-time").innerText = Math.floor(elapsedSeconds / 60) + " 分鐘";

                // 檢查是否到達截圖時間
                scheduleSeconds.forEach(targetSec => {
                    if (elapsedSeconds >= targetSec && !hasTriggered[targetSec]) {
                        hasTriggered[targetSec] = true; // 標記已執行
                        let typeStr = targetSec < 60 ? `${targetSec}秒` : `${targetSec/60}分鐘`;
                        takeAndUploadScreenshot(`排程: ${typeStr}`);
                    }
                });
            }
        }, 1000);

        function showLog(msg, color = "#ffeb3b") {
            const logEl = document.getElementById("status-log");
            logEl.style.color = color;
            logEl.innerText = msg;
        }

        // ★ 核心升級：透過擴充功能擷取實體畫面
        function takeAndUploadScreenshot(type = "自動截圖") {
            showLog(`[${type}] 呼叫外掛截圖中...`, "#03A9F4");
            
            // 發送指令給 content.js (擴充功能)
            window.postMessage({ type: "REQUEST_CAPTURE" }, "*");

            // 設定 3 秒超時警告
            let captureTimeout = setTimeout(() => {
                showLog(`[${type}] 截圖失敗：未偵測到 Chrome 擴充功能，請確認是否已安裝並啟用！`, "#f44336");
            }, 3000);

            // 建立一次性的事件監聽器，接收圖片
            function captureListener(event) {
                if (event.source !== window || !event.data) return;

                if (event.data.type === "RECEIVE_CAPTURE") {
                    clearTimeout(captureTimeout); // 取消超時警告
                    window.removeEventListener("message", captureListener); // 移除監聽，避免重複執行

                    let imgData = event.data.dataUrl;
                    showLog(`[${type}] 擷取成功，上傳雲端中...`, "#ffeb3b");
                    uploadToCloud(imgData, type);
                }
            }
            window.addEventListener("message", captureListener);
        }

        function uploadToCloud(base64Data, type) {
            let payload = {
                image: base64Data,
                storeName: storeName,
                time: document.getElementById("current-time").innerText,
                type: type,
                videoTitle: document.getElementById("video-title").innerText
            };

            fetch(gasUrl, {
                method: "POST",
                headers: {
                    // 重要：使用 text/plain 避免觸發 CORS 預檢請求
                    "Content-Type": "text/plain;charset=utf-8" 
                },
                body: JSON.stringify(payload)
            })
            .then(response => response.text())
            .then(text => {
                let res = JSON.parse(text);
                if(res.status === "success") {
                    screenshotCount++;
                    document.getElementById("screenshot-count").innerText = `${screenshotCount} 張`;
                    showLog(`[${type}] 上傳成功！已存入雲端。`, "#4CAF50");
                } else {
                    showLog(`[${type}] 雲端錯誤: ` + res.message, "#f44336");
                }
            })
            .catch(err => {
                showLog(`[${type}] 連線失敗或網址未更新。`, "#f44336");
            });
        }

        // 拖曳方框功能
        const infoBox = document.getElementById("info-box");
        let isDragging = false, offsetX, offsetY;
        infoBox.addEventListener("mousedown", (e) => {
            if(e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return;
            isDragging = true;
            offsetX = e.clientX - infoBox.getBoundingClientRect().left;
            offsetY = e.clientY - infoBox.getBoundingClientRect().top;
            infoBox.style.cursor = "grabbing";
        });
        document.addEventListener("mousemove", (e) => {
            if (!isDragging) return;
            infoBox.style.left = (e.clientX - offsetX) + "px";
            infoBox.style.top = (e.clientY - offsetY) + "px";
        });
        document.addEventListener("mouseup", () => {
            isDragging = false;
            infoBox.style.cursor = "move";
        });
    </script>
</body>
</html>
